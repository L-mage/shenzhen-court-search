<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深圳市法院法官公务电话查询系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">深圳市法院法官公务电话查询</h1>
      <p class="subtitle">Shenzhen Court Judge Official Contact Inquiry</p>
      <p class="disclaimer">法院人员常有变动，如查不到所需法官电话，请通过12368诉讼服务热线查询。本站信息仅供参考，请以官方渠道为准。目前没有增加深汕特别合作区人民法院的通讯录。希望本网站能够为各位法律人提供便利！</p>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box-wrapper">
        <span class="search-icon">&#128269;</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="输入法官姓名、法院名称或关键字搜索..."
          autocomplete="off"
        />
        <button id="searchClear" class="search-clear">&times;</button>
      </div>
      <div class="search-tags" id="searchTags">
        <span class="tag-label">热门搜索：</span>
        <span class="tag" data-search="立案庭">立案庭</span>
        <span class="tag" data-search="深圳市中级人民法院">深圳市中级人民法院</span>
        <span class="tag" data-search="福田">福田</span>
        <span class="tag" data-search="刑事">刑事</span>
      </div>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
      <!-- 职能部门 -->
      <div class="filter-group">
        <h3 class="filter-title">职能部门</h3>
        <div class="filter-chips" id="departmentFilters">
          <button class="chip" data-filter="department" data-value="立案庭">立案庭</button>
          <button class="chip" data-filter="department" data-value="审判庭">审判庭</button>
          <button class="chip" data-filter="department" data-value="执行局">执行局</button>
          <button class="chip" data-filter="department" data-value="派出法庭">派出法庭</button>
        </div>
      </div>

      <!-- 案件类型 -->
      <div class="filter-group">
        <h3 class="filter-title">案件类型</h3>
        <div class="filter-chips" id="caseTypeFilters">
          <button class="chip" data-filter="caseType" data-value="刑事">刑事</button>
          <button class="chip" data-filter="caseType" data-value="民事">民事</button>
          <button class="chip" data-filter="caseType" data-value="行政">行政</button>
          <button class="chip" data-filter="caseType" data-value="知产">知产</button>
          <button class="chip" data-filter="caseType" data-value="商事">商事</button>
          <button class="chip" data-filter="caseType" data-value="劳动争议">劳动争议</button>
          <button class="chip" data-filter="caseType" data-value="房地产">房地产</button>
          <button class="chip" data-filter="caseType" data-value="破产">破产</button>
          <button class="chip" data-filter="caseType" data-value="涉外商事">涉外商事</button>
          <button class="chip" data-filter="caseType" data-value="金融">金融</button>
          <button class="chip" data-filter="caseType" data-value="少年">少年</button>
          <button class="chip" data-filter="caseType" data-value="家事">家事</button>
        </div>
      </div>

      <!-- 区（县）名称 -->
      <div class="filter-group">
        <h3 class="filter-title">区（县）名称</h3>
        <div class="filter-chips" id="districtFilters">
          <button class="chip" data-filter="district" data-value="福田区">福田区</button>
          <button class="chip" data-filter="district" data-value="罗湖区">罗湖区</button>
          <button class="chip" data-filter="district" data-value="南山区">南山区</button>
          <button class="chip" data-filter="district" data-value="宝安区">宝安区</button>
          <button class="chip" data-filter="district" data-value="龙岗区">龙岗区</button>
          <button class="chip" data-filter="district" data-value="盐田区">盐田区</button>
          <button class="chip" data-filter="district" data-value="龙华区">龙华区</button>
          <button class="chip" data-filter="district" data-value="坪山区">坪山区</button>
          <button class="chip" data-filter="district" data-value="光明区">光明区</button>
        </div>
      </div>

      <!-- 法院名称 -->
      <div class="filter-group">
        <h3 class="filter-title">法院名称</h3>
        <div class="filter-chips" id="courtFilters">
          <button class="chip" data-filter="court" data-value="深圳市中级人民法院">深圳市中级人民法院</button>
          <button class="chip" data-filter="court" data-value="福田区人民法院">福田区人民法院</button>
          <button class="chip" data-filter="court" data-value="罗湖区人民法院">罗湖区人民法院</button>
          <button class="chip" data-filter="court" data-value="南山区人民法院">南山区人民法院</button>
          <button class="chip" data-filter="court" data-value="宝安区人民法院">宝安区人民法院</button>
          <button class="chip" data-filter="court" data-value="龙岗区人民法院">龙岗区人民法院</button>
          <button class="chip" data-filter="court" data-value="盐田区人民法院">盐田区人民法院</button>
          <button class="chip" data-filter="court" data-value="龙华区人民法院">龙华区人民法院</button>
          <button class="chip" data-filter="court" data-value="坪山区人民法院">坪山区人民法院</button>
          <button class="chip" data-filter="court" data-value="光明区人民法院">光明区人民法院</button>
          <button class="chip" data-filter="court" data-value="前海合作区人民法院">前海合作区人民法院</button>
        </div>
      </div>

      <!-- Active Filters -->
      <div class="active-filters" id="activeFilters">
        <span class="active-filters-label">已选筛选：</span>
        <span id="activeFilterTags"></span>
        <button id="clearAllFilters" class="clear-all">清除全部</button>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <div class="results-header">
        <h2 class="results-title">查询结果 <span id="resultCount" class="result-count"></span></h2>
      </div>
      <div id="resultsContainer" class="results-container">
        <!-- Results will be rendered here -->
      </div>
      <div id="noResults" class="no-results hidden">
        <div class="no-results-icon">&#128270;</div>
        <p>未找到匹配的法官信息</p>
        <p class="no-results-hint">请尝试调整搜索关键字或筛选条件</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>本系统数据仅供参考，具体联系方式以法院官方公布为准</p>
    </footer>
  </div>

  <script src="judge-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
